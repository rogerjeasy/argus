[tool.poetry]
name = "argus-backend"
version = "0.1.0"
description = "Argus Orchestrator — FastAPI + ADK backend"
authors = ["Argus Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
anyio = "^4.0"          # imported directly by app/ws/session.py for CancelScope
fastapi = "^0.133.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
firebase-admin = "^6.5.0"
google-cloud-firestore = "^2.19.0"
google-cloud-secret-manager = "^2.20.0"
google-cloud-pubsub = "^2.39.0"
google-cloud-kms = "^3.16.0"
google-cloud-tasks = "^2.24.0"
google-cloud-translate = "^3.27.0"
google-genai = "^2.18.0"
google-adk = "^2.7.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-gcp-trace = "^1.7.0"
gtfs-realtime-bindings = "^2.2.0"
httpx = "^0.28.1"
twilio = "^9.11.0"
reportlab = "^4.2.5"
#: audioop-lts only supports Python 3.13+ (it's a backport of the module
#: removed from stdlib in 3.13 — see design doc §3 / this plan's Task 9).
#: Below 3.13, stdlib audioop already provides the same API, so this stays
#: python-restricted rather than an unconditional dependency.
audioop-lts = {version = "^0.2.2", python = ">=3.13"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "redteam: adversarial/red-team cases consolidated across all phases (Phase 5 design doc §4)",
]
